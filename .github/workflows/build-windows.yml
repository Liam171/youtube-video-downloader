name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install build dependencies
        run: pip install pyinstaller pyside6

      - name: Download yt-dlp and ffmpeg (Windows x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile yt-dlp.exe
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = (Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg_tmp | Select-Object -First 1).FullName
          Copy-Item $ff ffmpeg.exe
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force
          Get-Item yt-dlp.exe, ffmpeg.exe | Select-Object Name, Length

      - name: Build single-file exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name "YouTube下载器"
          --icon appicon.ico
          --add-binary "yt-dlp.exe;."
          --add-binary "ffmpeg.exe;."
          yt-dlp-gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/YouTube下载器.exe
          if-no-files-found: error
